name: Computational artifact checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.11.6'
      - name: Install Python dependencies
        run: python -m pip install -r experiments/requirements.txt
      - name: Replay evidence and validate with current code
        run: bash experiments/scripts/reproduce.sh --no-pdf
      - name: Check every reachable Git reference and build a private candidate
        run: >-
          python experiments/scripts/build_release.py
          --root .
          --output "$RUNNER_TEMP/xopt-computational-candidate.zip"
          --report "$RUNNER_TEMP/xopt-publication-check.json"
